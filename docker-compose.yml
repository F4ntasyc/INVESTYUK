name: investyuk

services:
  db:
    image: mysql:8.4
    container_name: investyuk-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: investyuk-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # antarmuka web (kotak masuk email uji)
      - "1025:1025" # SMTP

  app:
    profiles: [ "app" ]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investyuk-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
